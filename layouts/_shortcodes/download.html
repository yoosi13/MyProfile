{{- $file := resources.Get (.Get "src") -}}
{{- if $file -}}
<div style="margin: 12px 0;">
  <a href="{{ $file.RelPermalink }}" download="{{ path.Base $file.Name }}" target="_self" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background-color: #2b6cb0; color: #ffffff !important; text-decoration: none !important; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer;">
    📥 {{ default (path.Base $file.Name) (.Get "title") }}
  </a>
</div>
{{- else -}}
<p style="color: red;">파일을 찾을 수 없습니다: {{ .Get "src" }}</p>
{{- end -}}
